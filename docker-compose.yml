services:
  # Ganache - Local Ethereum blockchain for testing
  ganache:
    image: trufflesuite/ganache:v7.9.1
    container_name: zkdex-ganache
    ports:
      - "8545:8545"
    command:
      - --host=0.0.0.0
      - --port=8545
      - --networkId=1337
      - --accounts=10
      - --defaultBalanceEther=1000
      - --gasLimit=12000000
      - --gasPrice=20000000000
      - --mnemonic=candy maple cake sugar pudding cream honey rich smooth crumble sweet treat
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8545', (r) => process.exit(r.statusCode ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s
    networks:
      - zkdex-network

  # Contract deployment (runs once before app services start)
  # Deploys ZkDex, MockDai, and verifier contracts to Ganache
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: zkdex-base
    container_name: zkdex-migrate
    depends_on:
      ganache:
        condition: service_healthy
    environment:
      - GANACHE_HOST=ganache
      - GANACHE_PORT=8545
    networks:
      - zkdex-network
    command: npx truffle migrate --network docker

  # ZK-DEX Contract Test Runner
  zkdex:
    build:
      context: .
      dockerfile: Dockerfile
      target: zkdex-base
    container_name: zkdex-app
    depends_on:
      ganache:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - GANACHE_HOST=ganache
      - GANACHE_PORT=8545
    networks:
      - zkdex-network
    command: npx truffle test test/ZkDex.groth16.test.js test/ZkDex.production.test.js --network docker

  # Development service with shell access
  zkdex-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: zkdex-base
    container_name: zkdex-dev
    depends_on:
      ganache:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - GANACHE_HOST=ganache
      - GANACHE_PORT=8545
    volumes:
      - .:/app
      - /app/node_modules
      - /app/circuits-circom/node_modules
      - zkdex-circuits-build:/app/circuits-circom/build
    networks:
      - zkdex-network
    stdin_open: true
    tty: true
    command: /bin/bash
    profiles:
      - dev

  # Frontend integration test runner
  test-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: zkdex-base
    container_name: zkdex-test-frontend
    environment:
      - NODE_ENV=test
    networks:
      - zkdex-network
    command: node test/frontend-integration.test.js
    profiles:
      - test

  # Production test runner
  test-production:
    build:
      context: .
      dockerfile: Dockerfile
      target: zkdex-base
    container_name: zkdex-test-production
    depends_on:
      ganache:
        condition: service_healthy
    environment:
      - NODE_ENV=test
      - GANACHE_HOST=ganache
      - GANACHE_PORT=8545
    networks:
      - zkdex-network
    command: npx truffle test test/ZkDex.production.test.js --network docker
    profiles:
      - test

  # ============================================
  # Backend API Server (Express)
  # ============================================
  vapp-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: zkdex-base
    container_name: zkdex-vapp-api
    ports:
      - "3000:3000"
    working_dir: /app/vapp
    command: node app.cjs
    depends_on:
      ganache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - zkdex-network

  # ============================================
  # Frontend (Vue.js + Vite)
  # ============================================

  # Development mode with hot reload
  vapp-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: vapp-development
    container_name: zkdex-vapp-dev
    ports:
      - "8081:8080"
    volumes:
      - ./vapp/src:/app/src
      - ./vapp/public:/app/public
    environment:
      - VITE_GANACHE_URL=http://ganache:8545
      - VITE_API_URL=http://localhost:3000  # Browser accesses via host port
    depends_on:
      ganache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vapp-api:
        condition: service_started
    networks:
      - zkdex-network
    profiles:
      - dev

  # Production mode with nginx
  vapp:
    build:
      context: .
      dockerfile: Dockerfile
      target: vapp-production
    container_name: zkdex-vapp
    ports:
      - "8080:80"
    depends_on:
      ganache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vapp-api:
        condition: service_started
    networks:
      - zkdex-network

networks:
  zkdex-network:
    driver: bridge

volumes:
  zkdex-circuits-build:
    driver: local
